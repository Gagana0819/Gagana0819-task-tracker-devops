---
# Sets up the Task Tracker server. Safe to run again and again.
- name: Set up the Task Tracker server
  hosts: web
  become: true # run the tasks with sudo

  tasks:
    # ---------- Updates ----------
    - name: Update the package list and upgrade everything
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Install automatic security updates and fail2ban
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - fail2ban
        state: present

    - name: Check if the upgrade needs a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_file

    - name: Reboot if needed
      ansible.builtin.reboot:
      when: reboot_file.stat.exists

    # ---------- Swap (2G of "spare memory" on disk) ----------
    - name: Create a 2G swap file
      ansible.builtin.command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile
      register: swapfile

    - name: Only root may read the swap file
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"

    - name: Format the swap file and turn it on
      ansible.builtin.shell: mkswap /swapfile && swapon /swapfile
      when: swapfile.changed

    - name: Turn swap on at every boot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: /swapfile none swap sw 0 0

    # ---------- Firewall ----------
    - name: Firewall lets in SSH, HTTP and HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["22", "80", "443"]

    - name: Firewall is on (blocks everything else coming in)
      community.general.ufw:
        state: enabled

    # ---------- fail2ban ----------
    - name: fail2ban reads the right SSH log (ssh.service on Ubuntu 24.04)
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd-ubuntu.local
        content: |
          [sshd]
          journalmatch = _SYSTEMD_UNIT=ssh.service + _COMM=sshd
        mode: "0644"
      notify: Restart fail2ban

    - name: fail2ban is running and starts at boot
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    # ---------- Docker, Nginx, certbot ----------
    - name: Install Docker, Compose, Nginx and certbot
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present

    - name: The ubuntu user may use Docker without sudo
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Docker is running and starts at boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # ---------- App files ----------
    - name: App folder exists
      ansible.builtin.file:
        path: /opt/task-tracker
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy compose.yaml and deploy.sh from the repo (deploy/aws)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../deploy/aws/{{ item.name }}"
        dest: "/opt/task-tracker/{{ item.name }}"
        owner: ubuntu
        group: ubuntu
        mode: "{{ item.mode }}"
      loop:
        - { name: compose.yaml, mode: "0644" }
        - { name: deploy.sh, mode: "0755" }

    - name: Create .env with a new random database password (first time only)
      ansible.builtin.shell: |
        umask 077
        printf 'POSTGRES_DB=tasks\nPOSTGRES_USER=tasks\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
      args:
        chdir: /opt/task-tracker
        creates: /opt/task-tracker/.env
      become_user: ubuntu

    - name: GitHub Actions deploy key (it may ONLY run deploy.sh)
      ansible.posix.authorized_key:
        user: ubuntu
        key: "{{ lookup('file', '~/.ssh/tasktracker_deploy.pub') }}"
        key_options: 'restrict,command="/opt/task-tracker/deploy.sh"'

    # ---------- Nginx ----------
    - name: Nginx site for the app (HTTP for now - certbot adds HTTPS in 7.5)
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/task-tracker
        force: false # never overwrite: certbot edits this file later
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name devops-test-task.duckdns.org;

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Reload nginx

    - name: Turn the site on
      ansible.builtin.file:
        src: /etc/nginx/sites-available/task-tracker
        dest: /etc/nginx/sites-enabled/task-tracker
        state: link
      notify: Reload nginx

    - name: Turn the default Nginx page off
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    # ---------- Start the app ----------
    - name: Start the app (deploy.sh pulls the image and waits until it is healthy)
      ansible.builtin.command: /opt/task-tracker/deploy.sh
      changed_when: false # safe to run any time: it only restarts what changed

  handlers:
    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Reload nginx
      ansible.builtin.shell: nginx -t && systemctl reload nginx
